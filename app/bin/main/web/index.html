<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mouse Remoto</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background: #1e1e1e; color: #eee; font-family: sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            touch-action: none; /* impede o navegador de "rolar a página" com o dedo */
        }
        #status { position: absolute; top: 10px; font-size: 14px; opacity: 0.7; }
        #trackpad {
            width: 90vw; height: 70vh; background: #2c2c2c;
            border-radius: 12px; border: 2px solid #444;
        }
    </style>
</head>
<body>
    <div id="status">Conectando...</div>
    <div id="trackpad"></div>

    <script>
        const SENSIBILIDADE = 3; // 1.0 = padrão (1 pixel de dedo = 1 pixel de cursor). Aumente para mais sensível.

        const statusEl = document.getElementById('status');
        const trackpad = document.getElementById('trackpad');

        // Troque pelo IP do seu PC na rede local (vamos descobrir isso no Passo 5)
        const wsUrl = `ws://${location.hostname}:8081`;
        const socket = new WebSocket(wsUrl);

        socket.onopen = () => statusEl.textContent = 'Conectado ✅';
        socket.onclose = () => statusEl.textContent = 'Desconectado ❌';

        let ultimoX = 0;
        let ultimoY = 0;
        let moveu = false;
        let modoArrasto = false;      // true quando o "botão" está pressionado (drag)
        let timerPressionar = null;   // controla o tempo de "segurar" o dedo

        const TEMPO_PARA_ARRASTAR_MS = 350; // quanto tempo parado até virar "arrastar"
        const LIMIAR_MOVIMENTO_PX = 8;      // tolerância de tremida do dedo

        trackpad.addEventListener('touchstart', (e) => {
            const toque = e.touches[0];
            ultimoX = toque.clientX;
            ultimoY = toque.clientY;
            moveu = false;
            modoArrasto = false;

            // Se o dedo ficar parado por TEMPO_PARA_ARRASTAR_MS, ativa o modo arrasto
            timerPressionar = setTimeout(() => {
                if (!moveu) {
                    modoArrasto = true;
                    trackpad.style.background = '#3a5a3a'; // feedback visual: ficou "verde"
                    socket.send('DOWN');
                }
            }, TEMPO_PARA_ARRASTAR_MS);
        });

        trackpad.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const toque = e.touches[0];
            const dx = Math.round((toque.clientX - ultimoX) * SENSIBILIDADE);
            const dy = Math.round((toque.clientY - ultimoY) * SENSIBILIDADE);

            ultimoX = toque.clientX;
            ultimoY = toque.clientY;

            if (Math.abs(dx) > LIMIAR_MOVIMENTO_PX || Math.abs(dy) > LIMIAR_MOVIMENTO_PX) {
                // Moveu antes do tempo de "segurar" completar -> cancela a ativação do arrasto
                if (timerPressionar) {
                    clearTimeout(timerPressionar);
                    timerPressionar = null;
                }
            }

            if (Math.abs(dx) > 0 || Math.abs(dy) > 0) {
                moveu = true;
                if (socket.readyState === WebSocket.OPEN) {
                    socket.send(`MOVE:${dx}:${dy}`);
                }
            }
        });

        trackpad.addEventListener('touchend', () => {
            if (timerPressionar) {
                clearTimeout(timerPressionar);
                timerPressionar = null;
            }

            if (modoArrasto) {
                // Estava arrastando -> solta o "botão"
                socket.send('UP');
                modoArrasto = false;
                trackpad.style.background = '#2c2c2c'; // volta a cor original
            } else if (!moveu) {
                // Tap rápido, sem ter movido -> clique normal
                if (socket.readyState === WebSocket.OPEN) {
                    socket.send('CLICK');
                }
            }
        });
    </script>
</body>
</html>
