<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mouse Remoto</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background: #1e1e1e; color: #eee; font-family: sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            touch-action: none; /* impede o navegador de "rolar a página" com o dedo */
        }
        #status { position: absolute; top: 10px; font-size: 14px; opacity: 0.7; }
        #trackpad {
            width: 90vw; height: 70vh; background: #2c2c2c;
            border-radius: 12px; border: 2px solid #444;
        }
    </style>
</head>
<body>
    <div id="status">Conectando...</div>
    <div id="trackpad"></div>

    <script>
        const SENSIBILIDADE = 3; // 1.0 = padrão. Aumente para mais sensível.
        const TEMPO_DUPLO_CLIQUE_MS = 300; // janela para o 2º toque contar como "duplo toque"
        const LIMIAR_MOVIMENTO_PX = 8;     // tolerância de tremida do dedo

        const statusEl = document.getElementById('status');
        const trackpad = document.getElementById('trackpad');

        const wsUrl = `ws://${location.hostname}:8081`;
        const socket = new WebSocket(wsUrl);

        socket.onopen = () => statusEl.textContent = 'Conectado ✅';
        socket.onclose = () => statusEl.textContent = 'Desconectado ❌';

        let ultimoX = 0;
        let ultimoY = 0;
        let moveu = false;
        let modoArrasto = false;        // true = "botão" pressionado (drag ativo)
        let aguardandoSegundoToque = false; // true = já soltei o 1º toque e estou na janela de espera do 2º
        let timerCliquePendente = null; // controla o envio adiado do clique único

        trackpad.addEventListener('touchstart', (e) => {
            const toque = e.touches[0];
            ultimoX = toque.clientX;
            ultimoY = toque.clientY;
            moveu = false;

            if (aguardandoSegundoToque) {
                // Este é o 2º toque dentro da janela -> cancela o clique pendente do 1º
                // e ativa o modo arrasto IMEDIATAMENTE, sem precisar soltar o dedo.
                clearTimeout(timerCliquePendente);
                timerCliquePendente = null;
                aguardandoSegundoToque = false;

                modoArrasto = true;
                trackpad.style.background = '#3a5a3a'; // feedback visual: modo arrasto ativo
                socket.send('DOWN');
            }
        });

        trackpad.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const toque = e.touches[0];
            const dx = Math.round((toque.clientX - ultimoX) * SENSIBILIDADE);
            const dy = Math.round((toque.clientY - ultimoY) * SENSIBILIDADE);

            ultimoX = toque.clientX;
            ultimoY = toque.clientY;

            if (Math.abs(dx) > 0 || Math.abs(dy) > 0) {
                moveu = true;
                if (socket.readyState === WebSocket.OPEN) {
                    socket.send(`MOVE:${dx}:${dy}`);
                }
            }
        });

        trackpad.addEventListener('touchend', () => {
            if (modoArrasto) {
                // Estava arrastando -> solta o "botão"
                socket.send('UP');
                modoArrasto = false;
                trackpad.style.background = '#2c2c2c';
                return;
            }

            if (!moveu) {
                // Toque único, sem mover -> NÃO clica ainda. Espera a janela de
                // duplo-toque, pois pode ser o 1º toque de um gesto de arrastar.
                aguardandoSegundoToque = true;
                timerCliquePendente = setTimeout(() => {
                    aguardandoSegundoToque = false;
                    if (socket.readyState === WebSocket.OPEN) {
                        socket.send('CLICK');
                    }
                }, TEMPO_DUPLO_CLIQUE_MS);
            }
        });
    </script>
</body>
</html>
